<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef2">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>FocusFlow</title>
<style>
:root{--bg:#e9eef2;--card:#f8fafb;--line:#cfd8df;--tx:#14202b;--mu:#5d6b78;--ac:#2f5bea;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--line:#2a3743;--tx:#e8eef3;--mu:#8a9aa8;--ac:#6b8cff;--on:#0b1220}}
body[data-m=short],body[data-m=long]{--ac:#1f9d74}
@media(prefers-color-scheme:dark){body[data-m=short],body[data-m=long]{--ac:#43c79b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:calc(56px + env(safe-area-inset-top)) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.tank{position:relative;overflow:hidden;text-align:center;padding:28px 12px}
.tank i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ac);opacity:.18;transition:height .5s linear}
.tank>*{position:relative}
.big{font:400 84px/1 "Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums;margin:10px 0}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item span{flex:1}.item.d span{text-decoration:line-through;color:var(--mu)}
.item input{width:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:400 32px Georgia,serif}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars small{position:absolute;top:100%;left:0;right:0;text-align:center;color:var(--mu);font-size:11px;margin-top:2px}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu)}nav button.on{color:var(--ac);font-weight:600}
.lv button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px;width:90%}
dialog::backdrop{background:#0007}
h2{font-size:18px;margin:0 0 8px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.tank i{transition:none}}
</style></head><body>
<main>
<section id="v-timer" class="on">
  <div class="card tank"><i id="fill"></i>
    <div class="mu" id="lbl">Ready</div>
    <div class="big" id="time">25:00</div>
    <div class="mu" id="cur"></div>
  </div>
  <div class="card">
    <select id="task" aria-label="Current task"></select>
    <div id="idle" class="row">
      <button class="p" id="go">Start focus</button>
      <button id="mini">Just 5 minutes</button>
    </div>
    <div id="run" class="row hide"><button id="stop">Quit</button></div>
  </div>
  <div class="card" id="parkc">
    <h2>Parking lot</h2>
    <div class="mu">Stray thought? Park it here and get back to work.</div>
    <div class="row"><input id="pin" placeholder="Write it down"><button id="padd" style="flex:0">Park</button></div>
    <div id="plist"></div>
  </div>
</section>
<section id="v-tasks">
  <div class="card"><h2>Tasks</h2>
    <div class="row"><input id="tin" placeholder="Add a task"><button class="p" id="tadd" style="flex:0">Add</button></div>
    <div id="tlist"></div>
  </div>
</section>
<section id="v-stats">
  <div class="card stats"><div><b id="s1">0</b><span class="mu">min today</span></div><div><b id="s2">0</b><span class="mu">day streak</span></div><div><b id="s3">0</b><span class="mu">sessions</span></div></div>
  <div class="card"><h2>Last 7 days</h2><div class="bars" id="bars"></div><div style="height:18px"></div></div>
  <div class="card"><h2>Recent quits</h2><div id="quits" class="mu"></div></div>
</section>
<section id="v-set">
  <div class="card"><h2>Strictness</h2>
    <div class="row lv" id="lv"><button data-l="gentle">Gentle</button><button data-l="firm">Firm</button><button data-l="strict">Strict</button></div>
    <div class="mu" id="lvd"></div></div>
  <div class="card"><h2>Minutes</h2>
    <div class="row"><label class="mu">Focus<input id="sf" type="number" min="1"></label><label class="mu">Break<input id="ss" type="number" min="1"></label><label class="mu">Long break<input id="sl" type="number" min="1"></label></div></div>
</section>
</main>
<nav><button data-v="timer" class="on">Timer</button><button data-v="tasks">Tasks</button><button data-v="stats">Stats</button><button data-v="set">Settings</button></nav>
<dialog id="dlg"><h2 id="dm"></h2><input id="di" class="hide"><div class="row" id="db"></div></dialog>
<script>
const $=s=>document.querySelector(s),K='focusflow.v1',day=d=>(d||new Date()).toLocaleDateString('en-CA');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=Object.assign({set:{f:25,s:5,l:15,lv:'firm'},tasks:[],log:[],park:[],streak:0,last:null,cycle:0,timer:null,cur:null},JSON.parse(localStorage.getItem(K)||'null')||{});
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const LVD={gentle:'Skip breaks and quit any time.',firm:'Quitting needs a reason. Breaks can\'t be skipped.',strict:'Firm rules, and quitting a focus session resets your streak.'};

function ask(msg,btns,inp){$('#dm').textContent=msg;const i=$('#di');i.classList.toggle('hide',!inp);i.value='';const b=$('#db');b.innerHTML='';
 btns.forEach(([l,fn,p])=>{const e=document.createElement('button');e.textContent=l;if(p)e.className='p';
  e.onclick=()=>{if(inp===2&&p&&!i.value.trim()){i.focus();return}$('#dlg').close();fn(i.value.trim())};b.append(e)});
 $('#dlg').showModal()}
function beep(){try{const a=new AudioContext();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)})}catch(e){}}
function notify(t,b){if(!('Notification'in window)||Notification.permission!=='granted')return;
 navigator.serviceWorker?.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',tag:'ff',renotify:true,vibrate:[200,100,200,100,400],requireInteraction:true,silent:false})).catch(()=>new Notification(t,{body:b}))}

function start(mode,min,mini){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
 S.timer={mode,end:Date.now()+min*6e4,total:min*60,task:S.cur,mini:!!mini};save();render()}
function brk(){const L=S.cycle%4===0;start(L?'long':'short',L?S.set.l:S.set.s)}
function done(t){S.log.push({d:day(),m:Math.round(t.total/60),task:t.task,ok:1});const td=day(),y=day(new Date(Date.now()-864e5));
 if(S.last!==td){S.streak=S.last===y?S.streak+1:1;S.last=td}}
function finish(){const t=S.timer;S.timer=null;beep();
 if(t.mode==='focus'){done(t);if(!t.mini)S.cycle++;notify('Session complete','Nice work.');save();render();
  if(t.mini)ask('5 minutes done. Keep going?',[['Stop here',()=>{}],['Full session',()=>start('focus',S.set.f),1]]);
  else ask('Last 10%: is this task finished?',[['Needs another round',brk],['Task done',()=>{const k=S.tasks.find(x=>x.id===t.task);if(k)k.done=1;save();render();brk()},1]]);
 }else{notify('Break over','Ready for the next session?');save();render()}}
function stop(){const t=S.timer;if(!t)return;
 if(t.mode!=='focus'){S.timer=null;save();render();return}
 const lv=S.set.lv;
 ask('Quit this session? What got in the way?',[['Keep going',()=>{}],['Quit',why=>{
  S.log.push({d:day(),m:Math.round((t.total-(t.end-Date.now())/1000)/60),task:t.task,ok:0,why});
  if(lv==='strict'){S.streak=0;S.last=null}S.timer=null;save();render()},1]],lv==='gentle'?1:2)}

const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function paint(){const t=S.timer;if(!t)return;const left=Math.max(0,Math.ceil((t.end-Date.now())/1000));
 $('#time').textContent=fmt(left);$('#fill').style.height=(100-left/t.total*100)+'%';document.title=fmt(left)+' FocusFlow'}
function tick(){if(!S.timer)return;S.timer.end<=Date.now()?finish():paint()}

function render(){const t=S.timer,m=t?t.mode:'idle';document.body.dataset.m=m;
 $('#idle').classList.toggle('hide',!!t);
 $('#run').classList.toggle('hide',!t||(m!=='focus'&&S.set.lv!=='gentle'));
 $('#stop').textContent=m==='focus'?'Quit':'Skip break';
 $('#lbl').textContent=t?(m==='focus'?(t.mini?'Just 5 minutes':'Focus'):m==='short'?'Break':'Long break'):'Ready';
 if(t)paint();else{$('#time').textContent=fmt(S.set.f*60);$('#fill').style.height=0;document.title='FocusFlow'}
 const open=S.tasks.filter(x=>!x.done);if(!open.find(x=>x.id===S.cur))S.cur=open[0]?.id||null;
 $('#task').innerHTML='<option value="">No task</option>'+open.map(x=>`<option value="${x.id}"${x.id===S.cur?' selected':''}>${esc(x.t)}</option>`).join('');
 $('#task').value=S.cur||'';
 $('#plist').innerHTML=S.park.map((p,i)=>`<div class="item"><span>${esc(p)}</span><button data-p="${i}" aria-label="Remove">✕</button></div>`).join('');
 $('#tlist').innerHTML=S.tasks.map(x=>`<div class="item${x.done?' d':''}"><input type="checkbox" data-d="${x.id}"${x.done?' checked':''} aria-label="Done"><span>${esc(x.t)}</span><small class="mu">${S.log.filter(l=>l.task===x.id&&l.ok).length} sessions</small><button data-x="${x.id}" aria-label="Delete">✕</button></div>`).join('')||'<div class="mu">No tasks yet. Add the one you keep avoiding.</div>';
 const td=day(),ok=S.log.filter(l=>l.ok);
 $('#s1').textContent=ok.filter(l=>l.d===td).reduce((a,l)=>a+l.m,0);$('#s2').textContent=S.streak;$('#s3').textContent=ok.length;
 let w=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);w.push([d.toLocaleDateString('en',{weekday:'short'}),ok.filter(l=>l.d===day(d)).reduce((a,l)=>a+l.m,0)])}
 const mx=Math.max(30,...w.map(x=>x[1]));
 $('#bars').innerHTML=w.map(([n,v])=>`<div style="height:${v/mx*100}%" title="${v} min"><small>${n}</small></div>`).join('');
 const q=S.log.filter(l=>!l.ok).slice(-5).reverse();
 $('#quits').innerHTML=q.length?q.map(l=>`${l.d}: ${esc(l.why||'no reason given')}`).join('<br>'):'None yet.';
 document.querySelectorAll('#lv button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.set.lv));
 $('#lvd').textContent=LVD[S.set.lv];$('#sf').value=S.set.f;$('#ss').value=S.set.s;$('#sl').value=S.set.l;
 $('#parkc').classList.toggle('hide',!(t&&t.mode==='focus'));save()}

$('#go').onclick=()=>start('focus',S.set.f);
$('#mini').onclick=()=>start('focus',5,1);
$('#stop').onclick=stop;
$('#task').onchange=e=>{S.cur=e.target.value||null;save()};
const addP=()=>{const v=$('#pin').value.trim();if(v){S.park.push(v);$('#pin').value='';render()}};
$('#padd').onclick=addP;$('#pin').onkeydown=e=>e.key==='Enter'&&addP();
const addT=()=>{const v=$('#tin').value.trim();if(v){S.tasks.push({id:Date.now()+'',t:v,done:0});$('#tin').value='';render()}};
$('#tadd').onclick=addT;$('#tin').onkeydown=e=>e.key==='Enter'&&addT();
$('#plist').onclick=e=>{const i=e.target.dataset.p;if(i!=null){S.park.splice(i,1);render()}};
$('#tlist').onclick=e=>{const d=e.target.dataset;if(d.x){S.tasks=S.tasks.filter(x=>x.id!==d.x);render()}};
$('#tlist').onchange=e=>{const k=S.tasks.find(x=>x.id===e.target.dataset.d);if(k){k.done=e.target.checked?1:0;render()}};
$('#lv').onclick=e=>{if(e.target.dataset.l){S.set.lv=e.target.dataset.l;render()}};
[['sf','f'],['ss','s'],['sl','l']].forEach(([id,k])=>$('#'+id).onchange=e=>{S.set[k]=Math.max(1,+e.target.value||S.set[k]);render()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on')});
setInterval(tick,250);document.addEventListener('visibilitychange',tick);
render();tick();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
