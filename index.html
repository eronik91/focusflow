<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef2">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>FocusFlow</title>
<style>
:root{--bg:#e9eef2;--card:#f8fafb;--line:#cfd8df;--tx:#14202b;--mu:#5d6b78;--ac:#2f5bea;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--line:#2a3743;--tx:#e8eef3;--mu:#8a9aa8;--ac:#6b8cff;--on:#0b1220}}
body[data-m=short],body[data-m=long]{--ac:#1f9d74}
@media(prefers-color-scheme:dark){body[data-m=short],body[data-m=long]{--ac:#43c79b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.tank{position:relative;overflow:hidden;text-align:center;padding:28px 12px}
.tank i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ac);opacity:.18;transition:height .5s linear}
.tank>*{position:relative}
.ringw{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:0 auto}
.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--line);stroke-width:10}
.rp{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;stroke-dasharray:603.2;transition:stroke-dashoffset .5s linear,stroke .3s}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rin .big{font-size:clamp(48px,17vw,68px);margin:4px 0}
.hi{font:400 26px Georgia,serif;margin:4px 2px 14px}.hi small{display:block;font:14px system-ui,sans-serif;color:var(--mu);margin-top:2px}
.card{box-shadow:0 1px 3px rgba(20,32,43,.06)}button:active{transform:scale(.97)}
.cta{width:100%;padding:18px;font-size:18px}#go{width:100%;margin-top:8px}
.item.cur{border-left:3px solid var(--ac);padding-left:8px}.item[data-t]{cursor:pointer}
#db{flex-wrap:wrap}#db button{flex:1 1 40%}
.gear{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:6;width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--card)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gb{height:6px;background:var(--line);border-radius:3px;margin:10px 0 4px;overflow:hidden}.gb i{display:block;height:100%;background:var(--ac);transition:width .4s}
.star{border:0;background:none;padding:6px;font-size:18px;color:var(--mu)}.star.on{color:var(--ac)}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(7,auto);gap:3px}.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.wide{grid-column:1/-1}
#v-set .card>label{display:block;margin-top:10px}
#fm{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#fm .big{font-size:clamp(72px,24vw,160px)}#fm .row{width:min(420px,100%)}
.rpt{font:13px/1.45 system-ui,"Segoe UI",sans-serif;color:#000;background:#fff}.rpt .rh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #2f5bea;padding-bottom:8px}.rpt h1{font-size:26px;margin:0}.rpt h3{font-size:14px;margin:18px 0 4px}.rpt .rn{font-weight:600}
.rpt .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin:14px 0}.rpt .k{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.rpt table{width:100%;border-collapse:collapse}.rpt th,.rpt td{border-bottom:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}.rpt th{background:#eef1f6;font-size:11px;text-transform:uppercase}.rpt .r{text-align:right}.rpt .s td{font-weight:600;background:#f6f7f9}
.rpt .tot{display:flex;gap:30px;margin-top:18px;padding:12px;border:2px solid #2f5bea;border-radius:6px;font-size:14px}.rpt .tot b{font-size:20px}
.rpt .sig{display:flex;gap:40px;margin-top:50px}.rpt .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:11px;color:#555}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--card);outline:1px solid var(--line)}.row .sw{flex:0 0 40px}.sw.on{outline:3px solid var(--tx)}
.big{font:400 84px/1 "Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums;margin:10px 0}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item span{flex:1}.item.d span{text-decoration:line-through;color:var(--mu)}
.item input{width:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:400 32px Georgia,serif}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px}
.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars small{position:absolute;top:100%;left:0;right:0;text-align:center;color:var(--mu);font-size:11px;margin-top:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.brand{display:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:none;color:var(--mu);font-size:11px;padding:9px 2px}nav button.on{color:var(--ac);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lv button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px;width:90%}
dialog::backdrop{background:#0007}
h2{font-size:18px;margin:0 0 8px}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){.rp{transition:none}button:active{transform:none}}
@media(min-width:900px){
body{padding:0 0 0 224px}
main{max-width:1040px;padding:32px 36px}
nav{top:0;right:auto;width:224px;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 12px}
.brand{display:block;font:400 24px Georgia,serif;padding:4px 12px 22px}
nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:12px 14px;border-radius:10px;width:100%}
nav button.on{background:var(--bg)}
.big{font-size:112px}.rin .big{font-size:72px}#tclock{font-size:84px!important}
#v-time.on,#v-stats.on,#v-set.on{display:grid;gap:0 18px;align-items:start}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
#parkc.hide{display:block!important}
#v-time.on{grid-template-columns:360px 1fr}#v-time>.card:nth-child(3){grid-column:2;grid-row:1/span 2}
#v-stats.on,#v-set.on{grid-template-columns:1fr 1fr}#v-stats>.card:first-child{grid-column:1/-1}
#v-tasks.on{max-width:720px}
}
dialog label{display:block;margin-top:8px}
#print{display:none}
@media print{body{background:#fff!important;color:#000!important;padding:0!important;font:11pt/1.4 system-ui,"Segoe UI",sans-serif}main,nav,dialog,.gear{display:none!important}#print{display:block}#print h1{font-size:22pt;margin:0 0 8px}#print table{width:100%;border-collapse:collapse}#print th,#print td{border-bottom:1px solid #aaa;padding:5px 6px;text-align:left;vertical-align:top}#print .r{text-align:right}#print .s td{font-weight:600;background:#f0f0f0}#print .tt{font-weight:600;font-size:13pt;margin:10px 0 0}}
</style></head><body>
<button class="gear" id="gear" data-v="set" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
<main>
<section id="v-timer" class="on">
  <div class="hi" id="hi"></div>
  <div class="cols">
  <div class="colL">
  <div class="card tank"><div class="ringw"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="rt" cx="110" cy="110" r="96"/><circle id="ring" class="rp" cx="110" cy="110" r="96"/></svg>
    <div class="rin"><div class="mu" id="lbl">Ready</div><div class="big" id="time">25:00</div><div class="mu" id="cur"></div></div></div>
  </div>
  <div class="card">
    <div id="idle"><button class="p cta" id="mini">Just 5 minutes</button><button id="go">Start focus</button></div>
    <div id="run" class="row hide"><button id="fmb" class="hide">Focus mode</button><button id="stop">Quit</button></div>
  </div>
  </div>
  <div class="colR">
  <div class="card" id="tasks">
    <h2>Today</h2><div class="mu" id="thint"></div>
    <div class="row"><input id="tin" placeholder="What's one thing to do?" aria-label="New task"><button id="tplus" aria-label="Add client" style="flex:0">+</button><button class="p" id="tadd" style="flex:0">Add</button></div>
    <div id="tmore" class="row hide"><input id="tcin" list="cls" placeholder="Client (optional)" aria-label="Client"><input id="test" type="number" min="1" inputmode="numeric" placeholder="Est. min" aria-label="Estimated minutes" style="flex:0 0 100px"></div>
    <div id="tlist"></div>
    <button id="tall" class="hide" style="width:100%;margin-top:8px">Show all</button>
  </div>
  <div class="card" id="parkc">
    <h2>Parking lot</h2>
    <div class="mu">Stray thought? Park it here and get back to work.</div>
    <div class="row"><input id="pin" placeholder="Write it down"><button id="padd" style="flex:0">Park</button></div>
    <div id="plist"></div>
  </div>
  </div>
  </div>
</section>
<section id="v-time">
  <div class="card tank"><div class="mu" id="tstate">Not clocked in</div><div class="big" id="tclock" style="font-size:64px">0:00:00</div></div>
  <div class="card">
    <input id="tcl" list="cls" placeholder="Client (optional)" aria-label="Client"><datalist id="cls"></datalist>
    <input id="ttask" list="tl" placeholder="What are you working on?" style="margin-top:8px" aria-label="Task"><datalist id="tl"></datalist>
    <div class="row"><button class="p" id="tio">Clock in</button></div>
  </div>
  <div class="card"><div class="row"><button id="tadd2">+ Add entry</button><button class="p" id="trep">PDF report</button></div><div id="tents"></div></div>
</section>
<section id="v-stats">
  <div class="card stats"><div><b id="s1">0</b><span class="mu">min today</span></div><div><b id="s2">0</b><span class="mu">days this week</span></div><div><b id="s3">0</b><span class="mu">sessions</span></div></div>
  <div class="card wide"><h2>Last 12 weeks</h2><div class="heat" id="heat"></div><div class="mu" id="heatn" style="margin-top:8px"></div></div>
  <div class="card"><h2>Last 7 days</h2><div class="bars" id="bars"></div><div style="height:18px"></div></div>
  <div class="card"><h2>What gets in the way</h2><div id="quits" class="mu"></div><div class="mu" id="qh" style="margin-top:8px"></div></div>
</section>
<section id="v-set">
  <div class="card"><h2>Strictness</h2>
    <div class="row lv" id="lv"><button data-l="gentle">Gentle</button><button data-l="firm">Firm</button><button data-l="strict">Strict</button></div>
    <div class="mu" id="lvd"></div></div>
  <div class="card"><h2>Minutes</h2>
    <div class="row"><label class="mu">Focus<input id="sf" type="number" min="1"></label><label class="mu">Break<input id="ss" type="number" min="1"></label><label class="mu">Long break<input id="sl" type="number" min="1"></label></div></div>
  <div class="card"><h2>Focus</h2>
    <label class="mu">Daily goal (minutes, 0 to hide)<input id="sg" type="number" min="0" step="5"></label>
    <label class="mu">Completion sound<select id="ssn"><option value="chime">Chime</option><option value="bell">Bell</option><option value="soft">Soft</option><option value="off">Off</option></select></label>
    <label class="mu">Ambient sound while focusing<select id="sam"><option value="">Off</option><option value="brown">Brown noise</option><option value="white">White noise</option><option value="rain">Rain</option></select></label>
    <label class="mu" style="display:flex;gap:8px;align-items:center"><input id="sfa" type="checkbox" style="width:auto"> Open focus mode automatically</label></div>
  <div class="card"><h2>Accent color</h2><div class="row" id="acs"><button class="sw" data-ac="" style="background:#2f5bea" aria-label="Accent 1"></button><button class="sw" data-ac="#7c5cf0" style="background:#7c5cf0" aria-label="Accent 2"></button><button class="sw" data-ac="#e8604c" style="background:#e8604c" aria-label="Accent 3"></button><button class="sw" data-ac="#d98a00" style="background:#d98a00" aria-label="Accent 4"></button><button class="sw" data-ac="#d6457a" style="background:#d6457a" aria-label="Accent 5"></button></div></div>
  <div class="card"><h2>Sync</h2><div class="mu" id="sync">Loading…</div><div class="row"><button class="p" id="sbtn" disabled>Sign in with Google</button></div></div>
</section>
</main>
<nav><div class="brand">FocusFlow</div><button data-v="timer" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span>Today</span></button><button data-v="time"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Hours</span></button><button data-v="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Progress</span></button></nav>
<dialog id="edlg"><h2 id="edt">Entry</h2>
 <label class="mu">Date<input type="date" id="ed-d"></label>
 <div class="row"><label class="mu">In<input type="time" id="ed-i"></label><label class="mu">Out<input type="time" id="ed-o"></label></div>
 <label class="mu">Client<input id="ed-c" list="cls"></label>
 <label class="mu">Task<input id="ed-t"></label>
 <div class="row"><button id="ed-x">Cancel</button><button id="ed-del">Delete</button><button class="p" id="ed-s">Save</button></div></dialog>
<dialog id="rdlg"><h2>PDF report</h2>
 <div class="row"><label class="mu">From<input type="date" id="r-f"></label><label class="mu">To<input type="date" id="r-t"></label></div>
 <label class="mu">Client<select id="r-c"></select></label>
 <label class="mu">Your name<input id="r-n"></label>
 <div class="row"><label class="mu">Rate / hour (optional)<input id="r-r" type="number" min="0" step="any" inputmode="decimal"></label><label class="mu">Currency (optional)<input id="r-u" placeholder="USD"></label></div>
 <label class="mu">Number (optional)<input id="r-no"></label>
 <label class="mu" style="display:flex;gap:8px;align-items:center"><input id="r-sg" type="checkbox" style="width:auto"> Add signature lines</label>
 <div class="row"><button id="r-x">Cancel</button><button id="r-s" class="hide">Share…</button><button class="p" id="r-g">Download PDF</button></div></dialog>
<div id="print"></div>
<div id="fm" class="hide"><div class="mu" id="fml">Focus</div><div class="big" id="fmt">25:00</div><div class="mu" id="fmc"></div>
 <div class="row"><input id="fmp" placeholder="Park a thought"><button id="fmpa" style="flex:0">Park</button></div>
 <div class="row"><button id="fmx">Exit focus mode</button><button id="fmq">Quit</button></div></div>
<dialog id="dlg"><h2 id="dm"></h2><input id="di" class="hide"><div class="row" id="db"></div></dialog>
<script>
const $=s=>document.querySelector(s),K='focusflow.v1',day=d=>(d||new Date()).toLocaleDateString('en-CA');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=Object.assign({set:{f:25,s:5,l:15,lv:'gentle'},tasks:[],log:[],park:[],streak:0,last:null,cycle:0,timer:null,cur:null,ts:[],clk:null,inv:{}},JSON.parse(localStorage.getItem(K)||'null')||{});
const pick=o=>({set:o.set,tasks:o.tasks,log:o.log,park:o.park,streak:o.streak,last:o.last,cycle:o.cycle,timer:o.timer,cur:o.cur,ts:o.ts||[],clk:o.clk||null,inv:o.inv||{}});
let lastJ=JSON.stringify(pick(S));
const save=()=>{const j=JSON.stringify(pick(S));if(j!==lastJ){lastJ=j;S.u=Date.now();window.cloudPush&&cloudPush()}localStorage.setItem(K,JSON.stringify(S))};
window.FF={get:()=>({p:pick(S),u:S.u||0}),
 apply:r=>{const m=mergeTs(S.ts,r.ts||[]),rm=new Map((r.ts||[]).map(e=>[e.id,e.u])),ch=m.some(e=>rm.get(e.id)!==e.u);Object.assign(S,pick(r),{ts:m,u:r.u});lastJ=JSON.stringify(pick(S));localStorage.setItem(K,JSON.stringify(S));render();if(ch){lastJ='';save()}},
 merge:rts=>{const m=mergeTs(S.ts,rts||[]);if(JSON.stringify(m)!==JSON.stringify(S.ts)){S.ts=m;lastJ='';save();render()}else window.cloudPush&&cloudPush()}};
const LVD={gentle:'Skip breaks and quit any time, with an optional reason.',firm:"Quitting needs a reason. Breaks can't be skipped.",strict:"Firm rules, and a quit means that day doesn't count toward your week."};

function ask(msg,btns,inp){$('#dm').textContent=msg;const i=$('#di');i.classList.toggle('hide',!inp);i.value='';const b=$('#db');b.innerHTML='';
 btns.forEach(([l,fn,p])=>{const e=document.createElement('button');e.textContent=l;if(p)e.className='p';
  e.onclick=()=>{if(inp===2&&p&&!i.value.trim()){i.focus();return}$('#dlg').close();fn(i.value.trim())};b.append(e)});
 $('#dlg').showModal()}
function beep(){const k=S.set.snd||'chime';if(k==='off')return;try{const a=new AudioContext(),P={chime:[[880,0,.15],[880,.25,.15],[880,.5,.15]],bell:[[660,0,.7],[990,0,.7]],soft:[[523,0,.3],[659,.3,.3],[784,.6,.5]]}[k];P.forEach(([f,t,d])=>{const o=a.createOscillator(),g=a.createGain();o.type=k==='bell'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)})}catch(e){}}
function notify(t,b){if(!('Notification'in window)||Notification.permission!=='granted')return;
 navigator.serviceWorker?.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',tag:'ff',renotify:true,vibrate:[200,100,200,100,400],requireInteraction:true,silent:false})).catch(()=>new Notification(t,{body:b}))}

function start(mode,min,mini){if(mode==='focus'&&S.set.fa)FM=true;if(mode==='focus'&&!S.clk){const k=S.tasks.find(x=>x.id===S.cur);S.clk={in:mn(Date.now()),task:k?k.t:'',c:k&&k.c||''}}if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
 S.timer={mode,end:Date.now()+min*6e4,total:min*60,task:S.cur,mini:!!mini};save();render()}
function brk(){const L=S.cycle%4===0;start(L?'long':'short',L?S.set.l:S.set.s)}
function done(t){S.log.push({d:day(),m:Math.round(t.total/60),task:t.task,ok:1});const td=day(),y=day(new Date(Date.now()-864e5));
 if(S.last!==td){S.streak=S.last===y?S.streak+1:1;S.last=td}}
function finish(){const t=S.timer;S.timer=null;beep();navigator.vibrate&&navigator.vibrate([120,60,120]);
 if(t.mode==='focus'){done(t);if(!t.mini)S.cycle++;notify('Session complete','Nice work.');save();render();
  if(t.mini)ask('5 minutes done. Keep going?',[['Stop here',()=>{}],['Full session',()=>start('focus',S.set.f),1]]);
  else ask('Nice work. What next?',[['Keep going +10 min',()=>start('focus',10)],['Task done',()=>{const k=S.tasks.find(x=>x.id===t.task);if(k)k.done=1;save();render();brk()}],['Take a break',brk,1]]);
 }else{notify('Break over','Ready for the next session?');save();render()}}
function stop(){const t=S.timer;if(!t)return;
